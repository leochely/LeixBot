[project]
name = "LeixBot"
version = "2.0.0"
description = "LeixBot is a multi purpose twitch bot relying on the Twitchio library."
readme = "README.md"
requires-python = "==3.12.8"
dependencies = [
    "aiohappyeyeballs==2.6.1 ; python_full_version >= '3.9'",
    "aiohttp>=3.12.13",
    "aiosignal==1.3.1 ; python_full_version >= '3.7'",
    "anyio==4.10.0 ; python_full_version >= '3.9'",
    "asqlite",
    "async-timeout==4.0.3 ; python_full_version >= '3.7'",
    "attrs==21.2.0 ; python_full_version >= '2.7'",
    "beautifulsoup4==4.13.5 ; python_full_version >= '3.7'",
    "bidict==0.22.0 ; python_full_version >= '3.7'",
    "certifi==2021.10.8",
    "chardet==4.0.0 ; python_full_version >= '2.7'",
    "charset-normalizer==2.0.12 ; python_full_version >= '3.5'",
    "click==8.2.1 ; python_full_version >= '3.10'",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "fake-useragent==2.2.0 ; python_full_version >= '3.9'",
    "frozenlist==1.4.1 ; python_full_version >= '3.8'",
    "h11==0.16.0 ; python_full_version >= '3.8'",
    "howlongtobeatpy==1.0.19",
    "humanize==3.13.1 ; python_full_version >= '3.6'",
    "idna==3.3 ; python_full_version >= '3.5'",
    "iso8601==1.0.0 ; python_full_version >= '3.6.2' and python_full_version < '4'",
    "lxml==4.9.4 ; python_full_version >= '2.7'",
    "multidict==6.6.4 ; python_full_version >= '3.9'",
    "playsound==1.2.2",
    "propcache==0.3.2 ; python_full_version >= '3.9'",
    "psycopg==3.2.3 ; python_full_version >= '3.8'",
    "psycopg-pool==3.2.6 ; python_full_version >= '3.8'",
    "pyserial==3.5",
    "python-dotenv>=1.2.1",
    "python-engineio==4.3.2 ; python_full_version >= '3.6'",
    "python-socketio==5.6.0 ; python_full_version >= '3.6'",
    "requests==2.32.3 ; python_full_version >= '3.8'",
    "sniffio==1.3.1 ; python_full_version >= '3.7'",
    "soupsieve==2.8 ; python_full_version >= '3.9'",
    "starlette==0.48.0",
    "twitchio[starlette]==3.1.0 ; python_full_version >= '3.11'",
    "typing-extensions==4.15.0 ; python_full_version < '3.13'",
    "tzdata==2025.2 ; sys_platform == 'win32'",
    "urllib3==1.26.8 ; python_full_version >= '2.7' and python_full_version < '4'",
    "uvicorn==0.35.0",
    "websocket-client==1.7.0 ; python_full_version >= '3.8'",
    "websockets==12.0 ; python_full_version >= '3.8'",
    "wikipedia-api==0.5.4",
    "wikiquote==0.1.16 ; python_full_version >= '3.6' and python_full_version < '4'",
    "wrapt==1.16.0 ; python_full_version >= '3.6'",
    "yarl==1.20.1 ; python_full_version >= '3.9'",
    "zipp==3.17.0 ; python_full_version >= '3.8'",
]

[tool.uv.sources]
asqlite = { git = "https://github.com/Rapptz/asqlite.git", rev = "8d929c7628e53d01b6905866f8b6d350e76a8d40" }

[dependency-groups]
dev = [
    "watchfiles>=1.1.1",
]
